<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Empire | Architectural Visualization</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">

    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0/client",
        "three": "https://esm.sh/three@0.160.0",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.12?external=react,react-dom,three",
        "@react-three/drei": "https://esm.sh/@react-three/drei@9.88.16?external=react,react-dom,three,@react-three/fiber",
        "framer-motion": "https://esm.sh/framer-motion@12.0.0?external=react,react-dom",
        "lucide-react": "https://esm.sh/lucide-react@0.300.0?external=react"
      }
    }
    </script>

    <style>
        :root {
            --gold: #D4AF37;
            --dark: #020617;
            --white: #F8FAFC;
        }

        body {
            background-color: var(--dark);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
        }

        .gold-border {
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .gold-text {
            color: var(--gold);
        }

        .gold-bg {
            background-color: var(--gold);
        }

        .empire-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%);
            width: 100%;
            margin: 2rem 0;
            opacity: 0.5;
        }

        .decorative-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid var(--gold);
        }

        .top-left { top: 0; left: 0; border-right: none; border-bottom: none; }
        .top-right { top: 0; right: 0; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 0; left: 0; border-right: none; border-top: none; }
        .bottom-right { bottom: 0; right: 0; border-left: none; border-top: none; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--dark);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 4px;
        }

        /* 3D Container */
        #canvas-container {
            height: 70vh;
            width: 100%;
            position: relative;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { Suspense, useRef, useState, useMemo } from 'react';
        import { createRoot } from 'react-dom';
        import { Canvas, useFrame } from '@react-three/fiber';
        import { 
            Stage, 
            OrbitControls, 
            useGLTF, 
            Float, 
            Text, 
            MeshDistortMaterial, 
            PerspectiveCamera,
            Environment
        } from '@react-three/drei';
        import { motion, AnimatePresence } from 'framer-motion';
        import { 
            Menu, 
            X, 
            ArrowRight, 
            Layers, 
            Camera, 
            Maximize, 
            CreditCard, 
            ChevronDown, 
            Download,
            ExternalLink,
            Box
        } from 'lucide-react';

        // --- Utility Script: GDrive Link Converter ---
        const convertGDriveLink = (link) => {
            const regex = /\/d\/([a-zA-Z0-9-_]+)/;
            const match = link.match(regex);
            if (match && match[1]) {
                return `https://drive.google.com/uc?export=download&id=${match[1]}`;
            }
            return link;
        };

        // --- 3D Scene Components ---
        function Model({ url }) {
            const { scene } = useGLTF(url);
            return <primitive object={scene} />;
        }

        function Scene() {
            return (
                <>
                    <PerspectiveCamera makeDefault position={[0, 0, 5]} fov={50} />
                    <OrbitControls 
                        enableZoom={false} 
                        autoRotate 
                        autoRotateSpeed={0.5} 
                        maxPolarAngle={Math.PI / 2}
                        minPolarAngle={Math.PI / 3}
                    />
                    
                    <Suspense fallback={null}>
                        <Stage intensity={0.5} environment="city" adjustCamera={false}>
                            <Float speed={2} rotationIntensity={0.5} floatIntensity={1}>
                                <Model url="https://raw.githubusercontent.com/pmndrs/drei-assets/master/helmet-optimized.glb" />
                            </Float>
                        </Stage>
                    </Suspense>

                    <mesh position={[0, -2, 0]} rotation={[-Math.PI / 2, 0, 0]}>
                        <planeGeometry args={[10, 10]} />
                        <MeshDistortMaterial
                            color="#D4AF37"
                            transparent
                            opacity={0.1}
                            speed={2}
                            distort={0.4}
                        />
                    </mesh>

                    <Environment preset="night" />
                </>
            );
        }

        // --- UI Components ---
        const Navbar = () => {
            const [isOpen, setIsOpen] = useState(false);

            return (
                <nav className="fixed w-full z-50 px-6 py-4 flex justify-between items-center bg-transparent backdrop-blur-sm border-b gold-border">
                    <div className="flex items-center gap-2">
                        <div className="w-10 h-10 border gold-border flex items-center justify-center rotate-45">
                            <Box className="-rotate-45 gold-text" size={20} />
                        </div>
                        <span className="text-xl font-bold tracking-widest gold-text uppercase">Empire</span>
                    </div>

                    <div className="hidden md:flex gap-8 items-center uppercase text-xs tracking-[0.2em] font-medium opacity-80">
                        <a href="#showcase" className="hover:text-amber-500 transition-colors">Showcase</a>
                        <a href="#workflow" className="hover:text-amber-500 transition-colors">Workflow</a>
                        <a href="#pricing" className="hover:text-amber-500 transition-colors">Pricing</a>
                        <button className="gold-bg text-black px-6 py-2.5 rounded-none font-bold hover:bg-white transition-all duration-300">
                            Book Now
                        </button>
                    </div>

                    <div className="md:hidden">
                        <button onClick={() => setIsOpen(!isOpen)} className="gold-text">
                            {isOpen ? <X /> : <Menu />}
                        </button>
                    </div>
                </nav>
            );
        };

        const ProjectCard = ({ title, category, image }) => (
            <motion.div 
                whileHover={{ y: -10 }}
                className="relative group overflow-hidden gold-border aspect-[4/5] bg-slate-900"
            >
                <div className="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-110 opacity-60"
                     style={{ backgroundImage: `url(${image})` }} />
                
                <div className="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80" />
                
                <div className="absolute inset-0 p-8 flex flex-col justify-end">
                    <div className="decorative-corner top-left opacity-0 group-hover:opacity-100 transition-opacity" />
                    <div className="decorative-corner bottom-right opacity-0 group-hover:opacity-100 transition-opacity" />
                    
                    <span className="gold-text text-xs tracking-widest uppercase mb-2 font-mono">{category}</span>
                    <h3 className="text-3xl font-light mb-4">{title}</h3>
                    
                    <motion.button 
                        initial={{ opacity: 0, x: -20 }}
                        whileHover={{ x: 0 }}
                        className="flex items-center gap-2 gold-text border-t gold-border pt-4 w-fit opacity-0 group-hover:opacity-100 transition-all"
                    >
                        View Project <ArrowRight size={16} />
                    </motion.button>
                </div>
            </motion.div>
        );

        const PriceItem = ({ title, price, features }) => (
            <div className="p-10 gold-border bg-slate-900/50 relative">
                <div className="decorative-corner top-right !w-10 !h-10 border-gold/30" />
                <h4 className="text-2xl mb-2 gold-text">{title}</h4>
                <div className="text-4xl font-light mb-8">
                    <span className="text-xl">$</span>{price}
                    <span className="text-sm opacity-50 font-sans tracking-normal font-normal"> / per render</span>
                </div>
                <ul className="space-y-4 mb-10 text-sm opacity-70 font-light">
                    {features.map((f, i) => (
                        <li key={i} className="flex items-center gap-3">
                            <span className="w-1.5 h-1.5 gold-bg rotate-45" />
                            {f}
                        </li>
                    ))}
                </ul>
                <button className="w-full border gold-border gold-text py-3 uppercase text-xs tracking-widest hover:bg-amber-500 hover:text-black transition-all">
                    Inquiry
                </button>
            </div>
        );

        const WorkflowStep = ({ number, title, desc }) => (
            <div className="flex flex-col border-l gold-border pl-8 py-4 relative">
                <div className="absolute -left-1 top-4 w-2 h-2 gold-bg" />
                <span className="text-6xl font-black font-mono opacity-10 absolute -left-12 top-0 pointer-events-none">
                    {number}
                </span>
                <h4 className="text-xl mb-4 uppercase tracking-widest gold-text">{title}</h4>
                <p className="opacity-60 font-light leading-relaxed max-w-md">{desc}</p>
            </div>
        );

        const App = () => {
            return (
                <div className="min-h-screen">
                    <Navbar />

                    {/* Hero Section */}
                    <section className="relative h-screen flex items-center justify-center pt-20">
                        <div className="absolute inset-0 z-0">
                            <div id="canvas-container">
                                <Canvas shadows>
                                    <Scene />
                                </Canvas>
                            </div>
                        </div>

                        <div className="container mx-auto px-6 z-10 pointer-events-none">
                            <div className="max-w-4xl">
                                <motion.div
                                    initial={{ opacity: 0, y: 30 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    transition={{ duration: 1, ease: "easeOut" }}
                                >
                                    <span className="gold-text text-sm tracking-[0.4em] uppercase mb-6 block font-mono">Precision & Grandeur</span>
                                    <h1 className="text-7xl md:text-9xl mb-8 leading-tight font-light italic">
                                        Architectural <br />
                                        <span className="font-bold not-italic">Visualization</span>
                                    </h1>
                                    <p className="text-lg md:text-xl opacity-60 font-light max-w-xl leading-relaxed mb-12">
                                        Crafting hyper-realistic digital luxury. We transform blueprints into timeless masterpieces of light, texture, and emotion.
                                    </p>
                                    <div className="flex gap-6 pointer-events-auto">
                                        <button className="gold-bg text-black px-10 py-4 uppercase text-sm tracking-widest font-black hover:opacity-90 transition-opacity">
                                            Start Project
                                        </button>
                                        <button className="border gold-border gold-text px-10 py-4 uppercase text-sm tracking-widest hover:bg-gold hover:text-black transition-all">
                                            Our Portfolio
                                        </button>
                                    </div>
                                </motion.div>
                            </div>
                        </div>

                        <div className="absolute bottom-10 left-1/2 -translate-x-1/2 text-center opacity-30 animate-bounce">
                            <ChevronDown />
                        </div>
                    </section>

                    {/* Portfolio Showcase */}
                    <section id="showcase" className="py-32 bg-slate-950">
                        <div className="container mx-auto px-6">
                            <div className="flex justify-between items-end mb-24">
                                <div className="max-w-2xl">
                                    <h2 className="text-6xl mb-8">Select <span className="gold-text italic">Narratives</span></h2>
                                    <div className="w-24 h-1 gold-bg mb-8" />
                                    <p className="opacity-60 text-lg font-light">From neoclassical penthouses to brutalist villas, our renders capture the essence of high-society living.</p>
                                </div>
                                <div className="text-right hidden md:block">
                                    <span className="text-xs gold-text tracking-[0.5em] uppercase">Scroll for more</span>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-10">
                                <ProjectCard 
                                    title="The Gilded Hall" 
                                    category="Interior" 
                                    image="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&q=80&w=1000" 
                                />
                                <ProjectCard 
                                    title="Onyx Terrace" 
                                    category="Exterior" 
                                    image="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&q=80&w=1000" 
                                />
                                <ProjectCard 
                                    title="Ivory Pavilion" 
                                    category="Public" 
                                    image="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&q=80&w=1000" 
                                />
                                <ProjectCard 
                                    title="Regal Estates" 
                                    category="Aerial" 
                                    image="https://images.unsplash.com/photo-1449156001437-3a166a6cb7f3?auto=format&fit=crop&q=80&w=1000" 
                                />
                            </div>
                        </div>
                    </section>

                    <div className="empire-divider container mx-auto px-6" />

                    {/* Workflow Section */}
                    <section id="workflow" className="py-32">
                        <div className="container mx-auto px-6">
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-24">
                                <div className="relative">
                                    <div className="sticky top-32">
                                        <h2 className="text-6xl mb-12">The Empire <br /><span className="gold-text italic">Process</span></h2>
                                        <div className="aspect-square gold-border p-4">
                                            <div className="w-full h-full bg-slate-900 border gold-border flex items-center justify-center p-20 opacity-40">
                                                <Layers size={120} className="gold-text animate-pulse" />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div className="space-y-24">
                                    <WorkflowStep 
                                        number="01" 
                                        title="Initial Blueprint Meta-Analysis" 
                                        desc="We don't just look at drawings. We study the light fall, site topography, and client desires to build a digital soul before a single polygon is placed." 
                                    />
                                    <WorkflowStep 
                                        number="02" 
                                        title="Volume & Geometry Sculpting" 
                                        desc="Creating a high-fidelity 3D base. Every millimeter is verified for structural logic and visual balance." 
                                    />
                                    <WorkflowStep 
                                        number="03" 
                                        title="Textural Alchemistry" 
                                        desc="Applying physically accurate materials. Marble that feels cold, silk that reflects light softly, and wood with age-worn character." 
                                    />
                                    <WorkflowStep 
                                        number="04" 
                                        title="Luminance Performance" 
                                        desc="Simulation of global illumination. We direct the sun to find the most dramatic shadows and the softest glows." 
                                    />
                                    <WorkflowStep 
                                        number="05" 
                                        title="Grand Finale Rendering" 
                                        desc="The final 8K production. Post-production color grading and atmospheric enhancements for a cinematic finish." 
                                    />
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Pricing Section */}
                    <section id="pricing" className="py-32 bg-slate-950">
                        <div className="container mx-auto px-6">
                            <div className="text-center mb-24">
                                <span className="gold-text text-sm tracking-widest uppercase mb-4 block">Fair Value</span>
                                <h2 className="text-6xl">Price List</h2>
                                <div className="w-20 h-1 gold-bg mx-auto mt-8" />
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                <PriceItem 
                                    title="Standard Portfolio" 
                                    price="250"
                                    features={["4K Resolution Render", "Basic Soft Lighting", "Furniture Stock Library", "2 Revisions"]}
                                />
                                <PriceItem 
                                    title="Empire Masterpiece" 
                                    price="500"
                                    features={["8K Resolution Render", "Custom Texture Mapping", "Cinematic Environment", "Unlimited Revisions", "AI Upscaling"]}
                                />
                                <PriceItem 
                                    title="Royal Animation" 
                                    price="1500"
                                    features={["30s Cinematic Flythrough", "Soundtrack Integration", "Day/Night Transitions", "VIP Support"]}
                                />
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="py-20 gold-border border-t bg-black relative overflow-hidden">
                        <div className="container mx-auto px-6 relative z-10">
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-12 mb-20">
                                <div className="col-span-2">
                                    <div className="flex items-center gap-2 mb-8">
                                        <div className="w-10 h-10 border gold-border flex items-center justify-center rotate-45">
                                            <Box className="-rotate-45 gold-text" size={20} />
                                        </div>
                                        <span className="text-2xl font-bold tracking-widest gold-text uppercase">Empire Viz</span>
                                    </div>
                                    <p className="opacity-50 font-light max-w-sm mb-10 leading-relaxed">
                                        International architectural visualization studio dedicated to the elite. 
                                        Redefining the standard of digital prestige since 2018.
                                    </p>
                                    <div className="flex gap-4">
                                        <a href="#" className="w-10 h-10 gold-border flex items-center justify-center rounded-full hover:bg-gold hover:text-black transition-all">
                                            <Download size={16} />
                                        </a>
                                        <a href="#" className="w-10 h-10 gold-border flex items-center justify-center rounded-full hover:bg-gold hover:text-black transition-all">
                                            <ExternalLink size={16} />
                                        </a>
                                    </div>
                                </div>
                                <div>
                                    <h4 className="gold-text mb-6 uppercase text-sm tracking-widest">Navigation</h4>
                                    <ul className="space-y-4 text-sm opacity-60 font-light">
                                        <li><a href="#" className="hover:gold-text">Showcase</a></li>
                                        <li><a href="#" className="hover:gold-text">Workflow</a></li>
                                        <li><a href="#" className="hover:gold-text">Pricing</a></li>
                                        <li><a href="#" className="hover:gold-text">Terms</a></li>
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="gold-text mb-6 uppercase text-sm tracking-widest">Contact</h4>
                                    <div className="space-y-4 text-sm opacity-60 font-light">
                                        <p>Mayfair, London <br />W1J 5AJ</p>
                                        <p className="gold-text">contact@empireviz.com</p>
                                        <p>+44 (0) 20 7946 0000</p>
                                    </div>
                                </div>
                            </div>
                            <div className="pt-10 border-t border-white/10 text-center text-[10px] opacity-30 uppercase tracking-[0.5em]">
                                &copy; 2024 EMPIRE ARCHITECTURAL VISUALIZATION. ALL RIGHTS RESERVED.
                            </div>
                        </div>
                        
                        {/* Background Decoration */}
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-amber-500/5 blur-[120px] rounded-full pointer-events-none" />
                    </footer>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
